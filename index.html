<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>運転代行 日報</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<script>try{var _t=localStorage.getItem("nippo-theme");if(!_t)_t=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";document.documentElement.dataset.theme=_t;}catch(e){document.documentElement.dataset.theme="light";}</script>

<style>
:root{--navy:#4a6076;--navy2:#63798d;--bg:#f2efe8;--card:#faf7f0;--line:#d9d4c7;--txt:#33322e;--sub:#75705f;--green:#4a7a5c;--red:#a35650;--amber:#97783a;--head:#3d4f61;--chip:#eae7dd;--chiptxt:#4a6076;--input:#fffdf8;--dangerbg:#f4e4e0;--islbg:#e4eee3;--halfbg:#f6ecd4}
html[data-theme="dark"]{--navy:#93a9c4;--navy2:#3a506b;--bg:#1d1f22;--card:#25272b;--line:#3a3d42;--txt:#ddd9cf;--sub:#a09c92;--green:#84ad92;--red:#d1918a;--amber:#d3af72;--head:#23282e;--chip:#2e3134;--chiptxt:#c9c4b8;--input:#2a2c30;--dangerbg:#3b2a28;--islbg:#28382c;--halfbg:#3b3424}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;background:var(--bg);color:var(--txt);font-size:16px;line-height:1.55}
header{background:var(--head);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20}
header .ttl{font-weight:700;font-size:18px}
header button{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px}
main{max-width:1180px;margin:0 auto;padding:12px 12px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
h2{font-size:17px;margin:2px 0 12px;color:var(--navy)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 5px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:var(--input);color:var(--txt)}
textarea{resize:vertical}
.btn{display:inline-block;border:none;border-radius:9px;padding:13px 16px;font-size:15px;font-weight:600;cursor:pointer;text-align:center}
.btn-main{background:var(--navy);color:#fff;width:100%}
.btn-sub{background:var(--chip);color:var(--chiptxt)}
.btn-gps{background:var(--navy2);color:#fff;width:100%;padding:10px;font-size:14px;margin-top:6px}
.btn-now{background:var(--chip);color:var(--chiptxt);padding:10px;font-size:14px;margin-top:6px;width:100%}
.btn-danger{background:var(--dangerbg);color:var(--red)}
.btn-small{padding:7px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{flex:1;padding:12px 4px;background:var(--input);border:none;font-size:15px;cursor:pointer;color:var(--sub)}
.seg button.on{background:var(--navy);color:#fff;font-weight:700}
.seg button.on.green{background:var(--green)}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:15px}
.sum-grid .k{color:var(--sub)}
.sum-grid .v{text-align:right;font-weight:600}
.sum-big{font-size:22px;font-weight:800;color:var(--navy)}
.trip{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.trip .t1{font-weight:700}
.trip .t2{color:var(--sub);font-size:14px;margin-top:3px}
.trip .fare{font-weight:800;color:var(--navy);font-size:16px}
.badge{display:inline-block;font-size:12px;padding:2px 7px;border-radius:99px;background:var(--chip);color:var(--chiptxt);margin-left:6px;vertical-align:2px}
.badge.island{background:var(--islbg);color:var(--green)}
.badge.half{background:var(--halfbg);color:var(--amber)}
.trip .acts{display:flex;gap:8px;margin-top:8px}
.trip .acts button{flex:1}
.navrow{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.navrow button{background:var(--input);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:11px 14px;font-size:15px}
.navrow input{flex:1}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left}
th{background:var(--chip)}
td.num,th.num{text-align:right}
details{margin-bottom:10px}
summary{cursor:pointer;font-weight:600;color:var(--navy);padding:8px 0}
.msg{font-size:14px;margin:10px 0;min-height:18px}
.msg.ok{color:var(--green)}.msg.err{color:var(--red)}
.hidden{display:none!important}
.batchrow{border:1px dashed var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.batchrow .rh{font-weight:700;color:var(--navy);font-size:13px}
#printArea{display:none}
@media print{
  body{background:#fff}
  #appRoot,#loginRoot{display:none!important}
  #printArea{display:block;color:#000;font-size:12px}
  #printArea h1{font-size:18px;margin:0 0 6px}
  #printArea h2{font-size:14px;color:#000;margin:14px 0 6px}
  #printArea table{font-size:11px}
  #printArea th{background:#eee}
  #printArea .nw{white-space:nowrap}
  #printArea .daybreak{page-break-before:always}
  #printArea .sumline{margin:2px 0}
}
.stopwatch{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px;background:var(--input)}
.sw-label{font-size:13px;color:var(--sub)}
.sw-time{font-size:40px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;line-height:1.15}
.sw-min{font-size:13px;color:var(--sub)}
.sw-btns{display:flex;gap:8px;margin-left:auto}
.sw-btns button{border:none;border-radius:8px;padding:14px 20px;font-size:16px;font-weight:700;cursor:pointer}
.sw-toggle{background:var(--navy);color:#fff}
.sw-toggle.run{background:var(--red)}
.sw-reset{background:var(--chip);color:var(--chiptxt)}
header .hbtns{display:flex;gap:8px;align-items:center}
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="dark"] .btn-main{background:var(--navy2)}
html[data-theme="dark"] .seg button.on{background:var(--navy2)}
@media (min-width:1000px){
  #dayView{display:grid;grid-template-columns:minmax(420px,5fr) 7fr;gap:0 14px;align-items:start}
  #dayView .navrow{grid-column:1/-1}
  #dayView .card-summary{grid-column:1;grid-row:2}
  #dayView .card-form{grid-column:1;grid-row:3}
  #dayView .card-trips{grid-column:2;grid-row:2/span 2}
  #dayView .card-exp{grid-column:1;grid-row:4}
  #dayView .card-memo{grid-column:2;grid-row:4}
  #dayView .card-fare{grid-column:1/-1;grid-row:5}
  #monthView{display:grid;grid-template-columns:minmax(380px,5fr) 7fr;gap:0 14px;align-items:start}
  #monthView .navrow{grid-column:1/-1}
  #monthView .card-msummary{grid-column:1;grid-row:2}
  #monthView .card-mdays{grid-column:2;grid-row:2}
}
</style>
</head>
<body>
<div id="loginRoot" class="hidden">
  <header><div class="ttl">運転代行 日報</div><button type="button" class="themeBtn">ダークに切替</button></header>
  <main>
    <div class="card">
      <h2>ログイン</h2>
      <label>メールアドレス</label>
      <input id="loginEmail" type="email" autocomplete="username">
      <label>パスワード</label>
      <input id="loginPass" type="password" autocomplete="current-password">
      <div style="height:12px"></div>
      <button class="btn btn-main" id="loginBtn">ログイン</button>
      <div class="msg" id="loginMsg"></div>
    </div>
  </main>
</div>

<div id="appRoot" class="hidden">
  <header>
    <div class="ttl">運転代行 日報</div>
    <div class="hbtns"><button type="button" class="themeBtn">ダークに切替</button><button id="logoutBtn">ログアウト</button></div>
  </header>
  <main>
    <!-- 日次ビュー -->
    <div id="dayView">
      <div class="navrow">
        <button id="prevDay">◀</button>
        <input type="date" id="dateInput">
        <button id="nextDay">▶</button>
      </div>
      <div class="card card-summary">
        <h2>今日のまとめ</h2>
        <div id="daySummary"></div>
        <div style="height:10px"></div>
        <div class="row">
          <button class="btn btn-sub" id="toMonthBtn">月ごとの集計を見る</button>
          <button class="btn btn-sub" id="printDayBtn">印刷 / PDF</button>
        </div>
      </div>
      <div class="card card-form">
        <h2>運行を追加</h2>
        <div class="stopwatch">
          <div>
            <div class="sw-label">立ち寄りタイマー</div>
            <div class="sw-time" id="swTime">00:00</div>
            <div class="sw-min" id="swMin">時間の確認用です（料金計算には連動しません）</div>
          </div>
          <div class="sw-btns">
            <button type="button" class="sw-toggle" id="swToggle">スタート</button>
            <button type="button" class="sw-reset" id="swReset">リセット</button>
          </div>
        </div>
        <div class="seg" id="formModeSeg">
          <button data-mode="single" class="on">1件入力</button>
          <button data-mode="batch">まとめ入力（最大20件）</button>
        </div>
        <div id="singleFormWrap"></div>
        <div id="batchFormWrap" class="hidden"></div>
        <div class="msg" id="formMsg"></div>
      </div>
      <div class="card card-trips">
        <h2>運行一覧</h2>
        <div id="tripList"></div>
      </div>
      <div class="card card-exp">
        <h2>経費</h2>
        <div id="expenseList"></div>
        <div class="row">
          <div style="flex:2"><label>内容</label><input id="expLabel" placeholder="ガソリン代 など"></div>
          <div><label>金額</label><input id="expAmount" type="number" inputmode="numeric" placeholder="0"></div>
        </div>
        <div style="height:10px"></div>
        <button class="btn btn-sub" id="expAddBtn" style="width:100%">経費を追加</button>
        <div class="msg" id="expMsg"></div>
      </div>
      <div class="card card-memo">
        <h2>その日のメモ</h2>
        <textarea id="dayMemo" rows="3"></textarea>
        <div style="height:10px"></div>
        <button class="btn btn-sub" id="memoSaveBtn" style="width:100%">メモを保存</button>
        <div class="msg" id="memoMsg"></div>
      </div>
      <div class="card card-fare">
        <h2>料金表</h2>
        <details><summary>一般料金表（令和6年11月1日改正）</summary><div id="fareTableGeneral"></div></details>
        <details><summary>島割料金表（令和7年6月1日改正）</summary><div id="fareTableIsland"></div></details>
      </div>
    </div>

    <!-- 月次ビュー -->
    <div id="monthView" class="hidden">
      <div class="navrow">
        <button id="backToDay">← 日報に戻る</button>
        <input type="month" id="monthInput">
      </div>
      <div class="card card-msummary">
        <h2>月のまとめ</h2>
        <div id="monthSummary"></div>
        <div style="height:10px"></div>
        <button class="btn btn-sub" id="printMonthBtn" style="width:100%">印刷 / PDF（月次集計）</button>
        <div style="height:8px"></div>
        <button class="btn btn-sub" id="printMonthFullBtn" style="width:100%">月分まとめてPDF（1日ごとページ分け）</button>
      </div>
      <div class="card card-mdays">
        <h2>日別</h2>
        <div id="monthDays"></div>
      </div>
    </div>
  </main>
</div>

<div id="printArea"></div>

<script>
const SUPABASE_URL = "https://yoqdoerdhjgygocvgkcf.supabase.co";
const SUPABASE_KEY = "sb_publishable_dkyThIAovPIO-59BlGf86A_f7TExEeq";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const WD = ["日","月","火","水","木","金","土"];
const yen = n => "¥" + Math.round(n).toLocaleString("ja-JP");
function fmtDate(dstr){ const d=new Date(dstr+"T00:00:00"); return (d.getMonth()+1)+"月"+d.getDate()+"日（"+WD[d.getDay()]+"）"; }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function addDays(dstr,n){ const d=new Date(dstr+"T00:00:00"); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- 料金計算 ---------- */
function bandFareGeneral(km){
  if (km == null || isNaN(km) || km < 0) km = 0;
  const n = Math.floor(km);
  if (n <= 20) return 2000 + 300*n;
  return 8000 + 400*(n-20);
}
function bandFareIsland(km){
  if (km == null || isNaN(km) || km < 0) km = 0;
  if (km < 2) return 1400;
  const n = Math.floor(km);
  if (n <= 9) return 1400 + 200*(n-1);
  return 3300 + 300*(n-10);
}
function calcFare(o){
  const base = o.fare_type === "island" ? bandFareIsland(o.distance_km) : bandFareGeneral(o.distance_km);
  let total = base + (o.stopover_min||0)*100 + (o.pickup_fee||0);
  if (o.half_price) total = Math.floor(total/2);
  return total;
}
const AUTO_TAGS = ["【クレジット】","【QR決済】","【島割】","【迎車500円】","【迎車1000円】","【半額】"];
function stripTags(memo){ let m = memo||""; for (const t of AUTO_TAGS) m = m.split(t).join(""); return m.replace(/\s+/g," ").trim(); }
function buildMemo(o){
  const tags = [];
  if (o.payment === "card") tags.push("【クレジット】");
  if (o.payment === "qr") tags.push("【QR決済】");
  if (o.fare_type === "island") tags.push("【島割】");
  if (o.pickup_fee === 500) tags.push("【迎車500円】");
  if (o.pickup_fee === 1000) tags.push("【迎車1000円】");
  if (o.half_price) tags.push("【半額】");
  const user = stripTags(o.memo||"");
  return (tags.join(" ") + (user ? " " + user : "")).trim();
}
const PAY_LABEL = {cash:"現金", card:"カード", qr:"QR決済"};

/* ---------- テーマ切替（ライト／ダーク） ---------- */
function applyTheme(t, save){
  document.documentElement.dataset.theme = t;
  if (save) { try{ localStorage.setItem("nippo-theme", t); }catch(e){} }
  document.querySelectorAll(".themeBtn").forEach(b => b.textContent = (t === "dark" ? "ライトに切替" : "ダークに切替"));
  const mc = document.querySelector('meta[name="theme-color"]');
  if (mc) mc.setAttribute("content", t === "dark" ? "#23282e" : "#3d4f61");
}
document.querySelectorAll(".themeBtn").forEach(b => b.addEventListener("click", () => {
  applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark", true);
}));
applyTheme(document.documentElement.dataset.theme || "light", false);
</script>
<script>
/* ---------- 運行フォーム ---------- */
function segHTML(field, opts, cur){
  return '<div class="seg" data-seg="'+field+'">' + opts.map(o =>
    '<button type="button" data-v="'+o.v+'" class="'+(String(cur)===String(o.v)?"on":"")+'">'+o.label+'</button>').join("") + '</div>';
}
function tripFormHTML(v){
  v = v || {};
  const g = (k,d) => (v[k] != null && v[k] !== "" ? v[k] : (d||""));
  return '<div class="tripform">'
  + '<div class="row"><div><label>お客様名</label><input data-f="customer_name" value="'+esc(g("customer_name"))+'" placeholder="お客様名"></div>'
  + '<div><label>車のナンバー</label><input data-f="car_number" value="'+esc(g("car_number"))+'" placeholder="例：4058"></div></div>'
  + '<div class="row"><div><label>迎え場所</label><input data-f="pickup" value="'+esc(g("pickup"))+'"><button type="button" class="btn btn-gps" data-gps="pickup">現在地</button></div>'
  + '<div><label>送り先</label><input data-f="destination" value="'+esc(g("destination"))+'"><button type="button" class="btn btn-gps" data-gps="destination">到着地</button></div></div>'
  + '<div class="row"><div><label>出発時間</label><input data-f="start_time" type="time" value="'+esc(g("start_time")).slice(0,5)+'"><button type="button" class="btn btn-now" data-now="start_time">今</button></div>'
  + '<div><label>終了時間</label><input data-f="end_time" type="time" value="'+esc(g("end_time")).slice(0,5)+'"><button type="button" class="btn btn-now" data-now="end_time">今</button></div></div>'
  + '<div class="row"><div><label>距離（km）</label><input data-f="distance_km" type="number" step="0.1" min="0" inputmode="decimal" value="'+esc(g("distance_km"))+'"></div>'
  + '<div><label>立ち寄り（分）</label><input data-f="stopover_min" type="number" min="0" inputmode="numeric" value="'+esc(g("stopover_min"))+'"></div></div>'
  + '<label>料金の種類</label>' + segHTML("fare_type", [{v:"general",label:"一般料金"},{v:"island",label:"島割"}], g("fare_type","general"))
  + '<label>迎車料金</label>' + segHTML("pickup_fee", [{v:"0",label:"なし"},{v:"500",label:"500円"},{v:"1000",label:"1,000円"}], g("pickup_fee","0"))
  + '<div class="row"><div><label>支払い</label><select data-f="payment">'
  +   '<option value="cash"'+(g("payment","cash")==="cash"?" selected":"")+'>現金</option>'
  +   '<option value="card"'+(g("payment")==="card"?" selected":"")+'>カード</option>'
  +   '<option value="qr"'+(g("payment")==="qr"?" selected":"")+'>QR決済</option></select></div>'
  + '<div><label>半額</label><div class="seg" data-seg="half_price"><button type="button" data-v="0" class="'+(g("half_price")?"":"on")+'">なし</button><button type="button" data-v="1" class="'+(g("half_price")?"on":"")+'">半額</button></div></div></div>'
  + '<label>料金（円）</label><input data-f="fare" type="number" min="0" inputmode="numeric" value="'+esc(g("fare"))+'">'
  + '<div style="font-size:12px;color:var(--sub);margin-top:4px">距離から自動計算されます（手入力で上書き可） <a href="#" data-resetfare="1">自動計算に戻す</a></div>'
  + '<label>備考（メモ）</label><input data-f="memo" value="'+esc(stripTags(g("memo")))+'">'
  + '<div style="font-size:12px;color:var(--sub);margin-top:4px">保存時の備考：<span data-memopreview></span></div>'
  + '</div>';
}
function segValue(root, field){
  const s = root.querySelector('[data-seg="'+field+'"]');
  const on = s ? s.querySelector("button.on") : null;
  return on ? on.dataset.v : null;
}
function gatherForm(root){
  const q = f => root.querySelector('[data-f="'+f+'"]');
  const o = {
    customer_name: q("customer_name").value.trim(),
    car_number: q("car_number").value.trim(),
    pickup: q("pickup").value.trim(),
    destination: q("destination").value.trim(),
    start_time: q("start_time").value || null,
    end_time: q("end_time").value || null,
    distance_km: parseFloat(q("distance_km").value) || 0,
    stopover_min: parseInt(q("stopover_min").value) || 0,
    fare_type: segValue(root,"fare_type") || "general",
    pickup_fee: parseInt(segValue(root,"pickup_fee") || "0"),
    half_price: segValue(root,"half_price") === "1",
    payment: q("payment").value,
    fare: parseInt(q("fare").value),
    memo: q("memo").value
  };
  if (isNaN(o.fare)) o.fare = calcFare(o);
  o.memo = buildMemo(o);
  return o;
}
function refreshForm(root){
  const q = f => root.querySelector('[data-f="'+f+'"]');
  const tmp = {
    distance_km: parseFloat(q("distance_km").value) || 0,
    stopover_min: parseInt(q("stopover_min").value) || 0,
    fare_type: segValue(root,"fare_type") || "general",
    pickup_fee: parseInt(segValue(root,"pickup_fee") || "0"),
    half_price: segValue(root,"half_price") === "1",
    payment: q("payment").value,
    memo: q("memo").value
  };
  if (!root.dataset.fareOverride) q("fare").value = calcFare(tmp);
  const pv = root.querySelector("[data-memopreview]");
  if (pv) pv.textContent = buildMemo(tmp) || "（なし）";
}
function wireForm(root){
  root.querySelectorAll("[data-seg]").forEach(seg => {
    seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
      seg.querySelectorAll("button").forEach(x => x.classList.remove("on"));
      b.classList.add("on");
      refreshForm(root);
    }));
  });
  root.querySelectorAll("[data-f]").forEach(el => {
    el.addEventListener("input", () => {
      if (el.dataset.f === "fare") root.dataset.fareOverride = "1";
      refreshForm(root);
    });
  });
  const rf = root.querySelector("[data-resetfare]");
  if (rf) rf.addEventListener("click", e => { e.preventDefault(); delete root.dataset.fareOverride; refreshForm(root); });
  root.querySelectorAll("[data-now]").forEach(b => b.addEventListener("click", () => {
    root.querySelector('[data-f="'+b.dataset.now+'"]').value = nowTime();
    sndTap();
  }));
  root.querySelectorAll("[data-gps]").forEach(b => b.addEventListener("click", () => gpsFill(root, b)));
  refreshForm(root);
}
/* ---------- 操作音（押せたか分かるように） ---------- */
let AC = null;
function primeAudio(){
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === "suspended") AC.resume();
  } catch(e){}
}
function tone(freq, at, dur){
  if (!AC) return;
  try {
    const t0 = AC.currentTime + at;
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(1.0, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
function sndTap(){ primeAudio(); tone(880, 0, 0.08); }
function sndSave(){ primeAudio(); tone(740, 0, 0.09); tone(1175, 0.1, 0.14); }
function inRing(lon, lat, ring){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1], xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) && (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
function azaLookup(lat, lon){
  if (!window.AZA_DATA) return "";
  for (const pair of window.AZA_DATA) {
    const name = pair[0], polys = pair[1];
    for (const poly of polys) {
      if (inRing(lon, lat, poly[0]) && !poly.slice(1).some(h => inRing(lon, lat, h))) return name;
    }
  }
  return "";
}
async function resolvePlaceName(lat, lon){
  const az = azaLookup(lat, lon);
  if (az) return az;
  try {
    const r = await fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lon+"&zoom=18&addressdetails=1", {headers:{"Accept-Language":"ja"}});
    const j = await r.json();
    const a = j.address || {};
    const p = a.quarter || (a.neighbourhood || "").replace(/[一二三四五六七八九十0-9]+丁目$/, "") || a.suburb || "";
    if (p) return p;
  } catch(e){}
  try {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 5000);
    const r = await fetch("https://mreversegeocode.gsi.go.jp/reverse-geocoder/LonLatToAddress?lat="+lat+"&lon="+lon, {signal: ctl.signal});
    clearTimeout(t);
    const j = await r.json();
    const lv = j && j.results && j.results.lv01Nm;
    if (lv) return String(lv).replace(/^大字/, "");
  } catch(e){}
  try {
    const r = await fetch("https://geoapi.heartrails.com/api/json?method=searchByGeoLocation&x="+lon+"&y="+lat);
    const j = await r.json();
    const loc = j && j.response && j.response.location && j.response.location[0];
    if (loc && loc.town) return loc.town;
  } catch(e){}
  return "";
}
function gpsFill(root, btn){
  const field = btn.dataset.gps;
  const input = root.querySelector('[data-f="'+field+'"]');
  const old = btn.textContent;
  btn.textContent = "取得中…"; btn.disabled = true;
  let best = null, wid = null, done = false;
  const started = Date.now();
  const finish = async () => {
    if (done) return; done = true;
    if (wid !== null) navigator.geolocation.clearWatch(wid);
    if (!best){ alert("位置情報が取得できませんでした"); btn.textContent = old; btn.disabled = false; return; }
    const {latitude:lat, longitude:lon} = best.coords;
    const place = await resolvePlaceName(lat, lon);
    if (place) {
      input.value = place;
      sndTap();
      btn.textContent = old; btn.disabled = false;
    } else {
      btn.textContent = "地名が取れませんでした";
      setTimeout(() => { btn.textContent = old; btn.disabled = false; }, 3000);
    }
  };
  wid = navigator.geolocation.watchPosition(pos => {
    if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
    if (best.coords.accuracy <= 30 || Date.now() - started > 12000) finish();
  }, err => { if (err.code === 1) finish(); }, {enableHighAccuracy:true, timeout:15000, maximumAge:0});
  setTimeout(finish, 13000);
}
</script>
<script>

});

$("printMonthBtn").addEventListener("click", printMonth);
$("printMonthFullBtn").addEventListener("click", printMonthFull);
$("formModeSeg").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
  $("formModeSeg").querySelectorAll("button").forEach(x => x.classList.remove("on")); b.classList.add("on");
  const batch = b.dataset.mode === "batch";
  $("singleFormWrap").classList.toggle("hidden", batch);

$("expAddBtn").addEventListener("click", async () => {
  primeAudio();
  const label = $("expLabel").value.trim(); const amount = parseInt($("expAmount").value) || 0;
  const msg = $("expMsg");
  if (!label || !amount){ msg.textContent = "内容と金額を入力してください"; msg.className = "msg err"; return; }
  const {error} = await sb.from("expenses").insert({date: currentDate, label, amount});
  if (error){ msg.textContent = "保存に失敗しました: " + error.message; msg.className = "msg err"; return; }
  sndSave();
  $("expLabel").value = ""; $("expAmount").value = ""; msg.textContent = "追加しました"; msg.className = "msg ok"; loadDay();
});
$("memoSaveBtn").addEventListener("click", async () => {
  primeAudio();
  const msg = $("memoMsg");
  const {error} = await sb.from("day_notes").upsert({date: currentDate, memo: $("dayMemo").value}, {onConflict: "date"});
  if (error){ msg.textContent = "保存に失敗しました: " + error.message; msg.className = "msg err"; return; }
  sndSave();
  msg.textContent = "保存しました"; msg.className = "msg ok";
});

/* ---------- 立ち寄りタイマー（時間の確認用・料金計算には連動しない） ---------- */
const SW_KEY = "nippo-stopwatch";
let swState = {startTs: 0, elapsed: 0, running: false};
try { const sv = JSON.parse(localStorage.getItem(SW_KEY) || "null"); if (sv && typeof sv.elapsed === "number") swState = sv; } catch(e) {}
function swNow(){ return swState.elapsed + (swState.running ? Date.now() - swState.startTs : 0); }
function swSave(){ try { localStorage.setItem(SW_KEY, JSON.stringify(swState)); } catch(e) {} }
function swRender(){
  const sec = Math.floor(swNow() / 1000);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), ss = sec % 60;
  $("swTime").textContent = (h > 0 ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(ss).padStart(2, "0");
  const sub = $("swMin");
  if (swState.running) sub.textContent = "いま " + (Math.floor(sec / 60) + 1) + " 分目です";
  else if (sec > 0) sub.textContent = Math.floor(sec / 60) + "分" + (sec % 60) + "秒 で止まっています";
  else sub.textContent = "時間の確認用です（料金計算には連動しません）";
  const tg = $("swToggle");
  tg.textContent = swState.running ? "ストップ" : (sec > 0 ? "再開" : "スタート");
  tg.classList.toggle("run", swState.running);
}
$("swToggle").addEventListener("click", () => {
  if (swState.running){ swState.elapsed = swNow(); swState.running = false; }
  else { swState.startTs = Date.now(); swState.running = true; }
  swSave(); swRender();
});
$("swReset").addEventListener("click", () => { swState = {startTs: 0, elapsed: 0, running: false}; swSave(); swRender(); });
setInterval(swRender, 500);
swRender();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
